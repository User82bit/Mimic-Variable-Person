name: Release Production

on:
  workflow_dispatch:
    inputs:

      version_type:
        description: Version Increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      production_release:
        description: Production Release
        required: true
        type: boolean

jobs:
  release:
    environment: Production

    runs-on: windows-latest

    permissions:
      contents: write
