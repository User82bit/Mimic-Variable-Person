name: Release Production

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version Increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Version Type
        shell: pwsh
        run: |
          Write-Host "Selected version: ${{ github.event.inputs.version_type }}"
