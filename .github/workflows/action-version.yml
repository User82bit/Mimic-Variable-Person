name: Gerar Release e Versao

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'homologa'
    runs-on: windows-latest # Alterado para windows-latest já que é um projeto C# para terminal
    permissions: 
      contents: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verificar mensagens de commit e calcular versao
        id: versioning
        run: |
          $LAST_TAG = git describe --tags --abbrev=0 2>$null
          if (-not $LAST_TAG) { $LAST_TAG = "v0.0.0" }
          Write-Host "Ultima versão encontrada: $LAST_TAG"

          $VERSION = $LAST_TAG.TrimStart('v')
          $PARTS = $VERSION.Split('.')
          [int]$MAJOR = $PARTS[0]
          [int]$MINOR = $PARTS[1]
          [int]$PATCH = $PARTS[2]

          $COMMIT_LOGS = git log "$LAST_TAG..HEAD" --oneline 2>$null
          if (-not $COMMIT_LOGS) { $COMMIT_LOGS = git log --oneline }

          if ($COMMIT_LOGS -match "BREAKING CHANGE|feat!(\(.*\))?:|fix!(\(.*\))?:") {
              $MAJOR++
              $MINOR = 0
              $PATCH = 0
          } elseif ($COMMIT_LOGS -match "feat(\(.*\))?:") {
              $MINOR++
              $PATCH = 0
          } elseif ($COMMIT_LOGS -match "(fix|bug)(\(.*\))?:") {
              $PATCH++
          }

          $NEW_TAG = "v$MAJOR.$MINOR.$PATCH"
          Write-Host "Nova versão calculada: $NEW_TAG"

          # Coleta os logs para montar o corpo do Release
          $CHANGELOG = git log "$LAST_TAG..HEAD" --pretty=format:"- %s" 2>$null
          if (-not $CHANGELOG) { $CHANGELOG = "- Atualização de versão" }

          # Salva as variáveis para as próximas etapas
          echo "new_version=$NEW_TAG" >> $env:GITHUB_OUTPUT
          echo "old_version=$LAST_TAG" >> $env:GITHUB_OUTPUT

          # Formata o changelog multilinha para o step de Release
          $delimiter = [System.Guid]::NewGuid().ToString()
          echo "changelog<<$delimiter" >> $env:GITHUB_OUTPUT
          echo "$CHANGELOG" >> $env:GITHUB_OUTPUT
          echo "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Ajuste para a versão do .NET que você está usando no VS

      - name: Compilar projeto (Publish)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Criar Tag no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.versioning.outputs.new_version }}
          git push origin main --tags

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_version }}
          name: Versão ${{ steps.versioning.outputs.new_version }}
          body: |
            ### O que há de novo nesta versão:
            ${{ steps.versioning.outputs.changelog }}
          files: |
            ./publish/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
